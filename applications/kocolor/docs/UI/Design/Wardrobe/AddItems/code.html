<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Custom Input Styles to match "Digital Atelier" vibe */
        .atelier-input {
            background-color: transparent;
            border: none;
            border-bottom: 1px solid theme('colors.outline-variant');
            border-radius: 0;
            padding: 12px 0;
            width: 100%;
            transition: border-color 0.3s ease;
            color: theme('colors.on-surface');
        }
        .atelier-input:focus {
            outline: none;
            border-bottom-color: theme('colors.primary');
            box-shadow: none;
        }
        
        /* Custom Toggle Switch */
        .toggle-checkbox:checked {
            right: 0;
            border-color: theme('colors.primary');
        }

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md text-body-md pb-24 md:pb-0">
<!-- TopAppBar -->
<header class="bg-surface docked full-width top-0 z-40 sticky shadow-[0_4px_30px_rgba(0,0,0,0.02)]">
<div class="flex justify-between items-center w-full px-container-margin py-4 max-w-7xl mx-auto">
<button class="text-primary hover:opacity-80 transition-opacity scale-100 active:scale-95 duration-300">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-display-lg text-display-lg md:font-headline-lg md:text-headline-lg tracking-tight text-primary">Vanity Vault</h1>
<button class="text-primary hover:opacity-80 transition-opacity scale-100 active:scale-95 duration-300">
<span class="material-symbols-outlined" data-icon="person">person</span>
</button>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow w-full max-w-3xl mx-auto px-container-margin py-8 md:py-12">
<div class="mb-10 text-center">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-2">Curate Your Wardrobe</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Add a new piece to your collection.</p>
</div>
<form class="space-y-10">
<!-- Photo Upload Area -->
<div class="relative group cursor-pointer">
<div class="bg-surface-container-lowest border-2 border-dashed border-outline-variant rounded-xl flex flex-col items-center justify-center p-12 transition-all duration-300 group-hover:border-primary group-hover:bg-surface-container-low group-hover:shadow-[0_8px_30px_rgba(0,40,35,0.05)]">
<span class="material-symbols-outlined text-4xl text-outline mb-4 group-hover:text-primary transition-colors" data-icon="photo_camera" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
<span class="font-label-md text-label-md text-on-surface-variant group-hover:text-primary transition-colors">Capture or Upload Photo</span>
</div>
</div>
<!-- Form Details Bento Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-x-gutter gap-y-8 bg-surface-container-lowest p-6 md:p-8 rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.03)]">
<!-- Name -->
<div class="md:col-span-2">
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="item-name">Item Name</label>
<input class="atelier-input font-body-lg text-body-lg" id="item-name" name="item-name" placeholder="e.g. Silk Wrap Dress" required="" type="text"/>
</div>
<!-- Category -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="category">Category</label>
<div class="relative">
<select class="atelier-input font-body-md text-body-md appearance-none pr-8" id="category" name="category">
<option disabled="" selected="" value="">Select a category</option>
<option value="tops">Tops</option>
<option value="bottoms">Bottoms</option>
<option value="dresses">Dresses</option>
<option value="outerwear">Outerwear</option>
<option value="shoes">Shoes</option>
<option value="accessories">Accessories</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center text-outline">
<span class="material-symbols-outlined" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
<!-- Brand -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="brand">Brand / Designer</label>
<input class="atelier-input font-body-md text-body-md" id="brand" name="brand" placeholder="e.g. The Row" type="text"/>
</div>
<!-- Color -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="color">Primary Color</label>
<input class="atelier-input font-body-md text-body-md" id="color" name="color" placeholder="e.g. Midnight Blue" type="text"/>
</div>
<!-- Favorite Toggle -->
<div class="flex items-center justify-between mt-4 md:mt-0 md:col-span-2 pt-4 border-t border-surface-container">
<div>
<span class="block font-label-md text-label-md text-on-surface">Mark as Favorite</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Add to your priority rotation</span>
</div>
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-surface-container-lowest border-4 border-surface-container-high appearance-none cursor-pointer transition-all duration-300 z-10 top-0 left-0" id="toggle" name="toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-surface-container-high cursor-pointer transition-colors duration-300" for="toggle"></label>
</div>
</div>
</div>
<!-- Submit Button -->
<div class="pt-6">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 px-8 rounded-full shadow-[0_8px_20px_rgba(0,40,35,0.15)] hover:bg-primary-container hover:shadow-[0_12px_24px_rgba(0,40,35,0.2)] transition-all duration-300 flex justify-center items-center gap-2" type="submit">
<span class="material-symbols-outlined" data-icon="check" style="font-variation-settings: 'wght' 600;">check</span>
                    Add to Vault
                </button>
</div>
</form>
</main>
<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden bg-surface-container-lowest shadow-[0_-4px_20px_rgba(0,0,0,0.03)] fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-3 pb-safe rounded-t-xl">
<a class="flex flex-col items-center justify-center text-on-tertiary-container hover:text-primary transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="dashboard">dashboard</span>
<span class="font-label-sm text-label-sm">Dashboard</span>
</a>
<a class="flex flex-col items-center justify-center text-on-tertiary-container hover:text-primary transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="wardrobe">admob</span>
<span class="font-label-sm text-label-sm">Closet</span>
</a>
<a class="flex flex-col items-center justify-center text-primary font-bold hover:text-primary transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="add_circle" style="font-variation-settings: 'FILL' 1;">add_circle</span>
<span class="font-label-sm text-label-sm">Add</span>
</a>
<a class="flex flex-col items-center justify-center text-on-tertiary-container hover:text-primary transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="favorite">favorite</span>
<span class="font-label-sm text-label-sm">Favorites</span>
</a>
<a class="flex flex-col items-center justify-center text-on-tertiary-container hover:text-primary transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
<span class="font-label-sm text-label-sm">Profile</span>
</a>
</nav>
