# -- Networking (Rest & GQL) --
okhttp = "5.4.0"
squareupRetrofit = "3.0.0"
apollo = "5.0.1"

# -- UI Utilities --
coil = "2.7.0"
composeMarkdown = "0.7.1"
accompanistPermissions = "0.37.3"
