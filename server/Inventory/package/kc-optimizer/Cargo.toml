[package]
name = "kc-optimizer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "kocolor-asset-processor"
path = "src/main.rs"

[dependencies]
# Image processing & Concurrency
image = { version = "0.24", features = ["webp"] }
rayon = "1.8"
blurhash = "0.2"

# Serialization & Deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Filesystem traversal
walkdir = "2.4"

# Compression
zstd = "0.13"

# Cryptography & Hashing (for deterministic signing)
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = "0.4"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
