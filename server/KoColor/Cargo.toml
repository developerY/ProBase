[package]
name = "kocolor"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1.28", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
jsonwebtoken = "9.2"

[[bin]]
name = "generate_payload"
path = "src/bin/generate_payload.rs"
