[package]
name = "kocolor"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1.28", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = "2.0" # Does not need "rand_core" here because we are loading a key, not making one
sha2 = "0.10"
reqwest = { version = "0.11", features = ["json"] }
jsonwebtoken = "9.2"
p256 = { version = "0.13", features = ["ecdsa"] }
ecdsa = { version = "0.16", features = ["signing", "verifying"] }
base64 = "0.21"
hex = "0.4"

[lib]
name = "kocolor"
path = "src/lib.rs"

[[bin]]
name = "generate_payload"
path = "src/bin/generate_payload.rs"
