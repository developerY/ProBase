[package]
name = "kc-optimizer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "kocolor-asset-processor"
path = "src/main.rs"

[dependencies]
# Image processing & Concurrency
image = "0.24"
rayon = "1.8"
blurhash = "0.2"

# Serialization & Deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Filesystem traversal
walkdir = "2.4"

# Cryptography & Hashing (for deterministic signing)
sha2 = "0.10"
ed25519-dalek = "2.1"
